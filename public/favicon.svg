<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- TellMe favicon: folded map + route + departing plane -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Left map panel -->
  <rect x="6" y="9.5" width="9.2" height="15" rx="1.6" fill="#52525b" fill-opacity="0.55"/>
  <!-- Right map panel -->
  <rect x="15.8" y="9.5" width="9.2" height="15" rx="1.6" fill="#52525b" fill-opacity="0.4"/>
  <!-- Fold edge highlight -->
  <path d="M15.5,10.2 L15.5,23.8" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>

  <!-- Route -->
  <path
    d="M9.2,21.8 L13.6,16.6 L19.8,12.8 L24.2,9.2"
    fill="none"
    stroke="#fafafa"
    stroke-width="1.55"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Waypoints -->
  <circle cx="13.6" cy="16.6" r="1.7" fill="#fafafa"/>
  <circle cx="13.6" cy="16.6" r="0.75" fill="#18181b"/>
  <circle cx="19.8" cy="12.8" r="1.7" fill="#fafafa"/>
  <circle cx="19.8" cy="12.8" r="0.75" fill="#18181b"/>

  <!-- Plane -->
  <path
    d="M0,-2.15 L4.2,0 L0,2.15 L0.75,0.5 L-2.2,0.5 L-2.2,-0.5 L0.75,-0.5 Z"
    transform="translate(25.2,8.4) rotate(-38)"
    fill="#fafafa"
  />
</svg>
